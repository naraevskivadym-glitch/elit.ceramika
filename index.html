    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

.logo {
    width: 175px;
    height: 175px;
    object-fit: cover;
    border-radius: 50%;

    border: 7px solid white;

    box-shadow:
        0 0 0 2px rgba(255,255,255,0.45),
        0 8px 35px rgba(0,0,0,0.55);

    margin-bottom: 22px;
}

h1 {
    font-size: 34px;
    font-weight: 800;
    text-shadow: 0 3px 12px rgba(0,0,0,0.8);
    margin-bottom: 8px;
}

.subtitle {
    font-size: 17px;
    color: #f1f1f1;
    margin-bottom: 35px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.link {
    display: flex;
    align-items: center;
    width: 100%;
    height: 76px;

    margin-bottom: 18px;
    padding: 0 24px;

    color: #111;
    text-decoration: none;

    background: rgba(255,255,255,0.94);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 20px;

    box-shadow: 0 8px 30px rgba(0,0,0,0.35);

    transition: 0.25s ease;
}

.link:hover {
    transform: translateY(-4px) scale(1.02);
    background: white;
    box-shadow: 0 14px 38px rgba(0,0,0,0.45);
}

.icon {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 20px;
    flex-shrink: 0;
}

.icon svg {
    width: 34px;
    height: 34px;
}

.separator {
    width: 1px;
    height: 38px;
    background: #ccc;
    margin-right: 22px;
}

.link-text {
    font-size: 19px;
    font-weight: 700;
}

.arrow {
    margin-left: auto;
    font-size: 30px;
    color: #555;
    transition: 0.25s;
}

.link:hover .arrow {
    transform: translateX(5px);
}


    .promo {
        margin-top: 25px;
        padding: 28px 20px;
        background: rgba(255,255,255,0.94);
        color: #111;
        border-radius: 20px;
        font-size: 25px;
        line-height: 1.35;
        font-weight: 800;
        box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    .promo span {
        display: inline-block;
        margin-top: 8px;
        color: #174fd1;
        font-size: 27px;
    }

    .footer {
    margin-top: 30px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

@media (max-width: 500px) {
    body {
        background-attachment: scroll;
    }

    .logo {
        width: 150px;
        height: 150px;
    }

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 16px;
        margin-bottom: 28px;
    }

    .link {
        height: 70px;
        border-radius: 18px;
    }

    .link-text {
        font-size: 18px;
    }
}
</style>
